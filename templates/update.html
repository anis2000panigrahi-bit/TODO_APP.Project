
{% extends 'base.html' %}

{% block title %}MyTodo - Update{% endblock %}

{% block body %}

<div class="container">

    <h2 class="text-center my-4">Update Your Todo</h2>

    <div class="card shadow p-4">

        <form action="/update/{{ todo.sno }}" method="POST">

            <div class="mb-3">

                <label class="form-label">Title</label>

                <input type="text"
                       class="form-control"
                       name="title"
                       value="{{ todo.title }}"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">Description</label>

                <textarea class="form-control"
                          name="desc"
                          rows="4"
                          required>{{ todo.desc }}</textarea>

            </div>

            <button type="submit" class="btn btn-success">
                Update Todo
            </button>

            <a href="/" class="btn btn-secondary">
                Back
            </a>

        </form>

    </div>

</div>

{% endblock %}
